# SPDX-License-Identifier: Apache-2.0
# Written but never run: the repository has no remote yet. Actions are pinned by commit SHA;
# verify the SHAs against the tags in the comments before the first push.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Scrub check
        # Generic rules only: the private patterns (SCRUB_PRIVATE_PATTERNS) are not available here.
        run: ./scripts/scrub-check.sh
      - name: Build and test (Testcontainers needs the runner's Docker)
        run: ./mvnw -B verify
